<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMIC GRADIUS - 横スクロールシューティング</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a1a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
    box-shadow: 0 0 40px rgba(80, 120, 255, 0.35);
    border-radius: 6px;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="450"></canvas></div>
<script>
'use strict';

// ============================================================
// 基本セットアップ
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const HUD_H = 40; // 下部パワーゲージ領域

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

// ============================================================
// サウンド (Web Audio API) - ポップな8bit風
// ============================================================
const AudioSys = {
  ctx: null, master: null, started: false,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
  },
  resume() {
    this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this.started) { this.started = true; BGM.start(); }
  },
  tone(freq, dur, type = 'square', vol = 0.15, slide = 0, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide !== 0) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, delay = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(g); g.connect(this.master);
    src.start(t);
  },
};

const SFX = {
  shoot()  { AudioSys.tone(880, 0.08, 'square', 0.07, -500); },
  laser()  { AudioSys.tone(220, 0.15, 'sawtooth', 0.08, 900); },
  missile(){ AudioSys.tone(300, 0.12, 'triangle', 0.09, -150); },
  pickup() { // コインっぽいポップ音
    AudioSys.tone(988, 0.07, 'square', 0.14);
    AudioSys.tone(1319, 0.18, 'square', 0.14, 0, 0.07);
  },
  powerup() { // パワーアップ発動ファンファーレ
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((f, i) => AudioSys.tone(f, 0.12, 'square', 0.13, 0, i * 0.07));
  },
  boom()   { AudioSys.noise(0.25, 0.22); AudioSys.tone(120, 0.2, 'square', 0.1, -80); },
  bigBoom(){ AudioSys.noise(0.5, 0.3); AudioSys.tone(80, 0.4, 'sawtooth', 0.15, -50); },
  playerDie() {
    AudioSys.noise(0.6, 0.3);
    [600, 450, 300, 150].forEach((f, i) => AudioSys.tone(f, 0.15, 'square', 0.12, -60, i * 0.12));
  },
  shieldHit() { AudioSys.tone(200, 0.1, 'square', 0.12, 100); },
  gameStart() {
    [523, 659, 784, 1047].forEach((f, i) => AudioSys.tone(f, 0.1, 'triangle', 0.15, 0, i * 0.09));
  },
  gameOver() {
    [784, 659, 523, 392, 262].forEach((f, i) => AudioSys.tone(f, 0.25, 'triangle', 0.15, 0, i * 0.22));
  },
};

// ---- ポップなBGMループ ----
const NOTE = (() => {
  const names = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  return (str) => {
    if (str === '-') return 0;
    const m = str.match(/^([A-G])(#?)(\d)$/);
    const semitone = names[m[1]] + (m[2] ? 1 : 0) + (parseInt(m[3]) + 1) * 12;
    return 440 * Math.pow(2, (semitone - 69) / 12);
  };
})();

const BGM = {
  timer: null, step: 0, nextTime: 0,
  stepDur: 60 / 152 / 2, // 152bpm 8分音符
  lead: ('C5 E5 G5 E5 A5 G5 E5 G5 D5 F5 A5 F5 B5 A5 F5 A5 ' +
         'E5 G5 B5 G5 C6 B5 G5 B5 A5 G5 F5 G5 E5 D5 C5 -').split(' '),
  bass: ('C3 - C3 C4 A2 - A2 A3 F2 - F2 F3 G2 - G2 G3 ' +
         'C3 - C3 C4 A2 - A2 A3 F2 - F2 F3 G2 G3 C3 -').split(' '),
  start() {
    if (this.timer) return;
    this.step = 0;
    this.nextTime = AudioSys.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 40);
  },
  tick() {
    if (!AudioSys.ctx) return;
    while (this.nextTime < AudioSys.ctx.currentTime + 0.15) {
      const i = this.step % this.lead.length;
      const delay = this.nextTime - AudioSys.ctx.currentTime;
      const lead = this.lead[i], bass = this.bass[i];
      if (lead !== '-') AudioSys.tone(NOTE(lead), this.stepDur * 0.9, 'square', 0.045, 0, Math.max(0, delay));
      if (bass !== '-') AudioSys.tone(NOTE(bass), this.stepDur * 0.8, 'triangle', 0.09, 0, Math.max(0, delay));
      if (i % 4 === 0) AudioSys.noise(0.03, 0.05, Math.max(0, delay)); // ハイハット風
      this.nextTime += this.stepDur;
      this.step++;
    }
  },
};

// ============================================================
// 入力
// ============================================================
const keys = {};
addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  AudioSys.resume();
  if (game.state === 'title' && (e.key === 'Enter' || e.key === ' ')) game.start();
  if (game.state === 'gameover' && e.key === 'Enter') game.reset();
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('pointerdown', () => {
  AudioSys.resume();
  if (game.state === 'title') game.start();
  else if (game.state === 'gameover') game.reset();
});

const input = {
  up:    () => keys['arrowup'] || keys['w'],
  down:  () => keys['arrowdown'] || keys['s'],
  left:  () => keys['arrowleft'] || keys['a'],
  right: () => keys['arrowright'] || keys['d'],
  shoot: () => keys['z'] || keys[' '],
  power: () => keys['x'] || keys['shift'],
};

// ============================================================
// パワーアップゲージ (グラディウス方式)
// ============================================================
const POWER_SLOTS = ['SPEED', 'MISSILE', 'DOUBLE', 'LASER', 'OPTION', 'SHIELD'];

// ============================================================
// プレイヤー
// ============================================================
const player = {
  x: 100, y: H / 2, r: 10,
  speed: 3.2, alive: true, invincible: 0,
  shootCd: 0, missileCd: 0,
  hasMissile: false, weapon: 'normal', // normal / double / laser
  shieldHp: 0,
  gauge: 0, // 0=なし 1..6
  history: [], // オプション追従用の軌跡
  options: 0,  // オプション数 (最大4)
  reset(full) {
    this.x = 100; this.y = H / 2;
    this.alive = true; this.invincible = 120;
    if (full) {
      this.speed = 3.2; this.hasMissile = false; this.weapon = 'normal';
      this.shieldHp = 0; this.gauge = 0; this.options = 0; this.history = [];
    }
  },
  update() {
    if (!this.alive) return;
    if (this.invincible > 0) this.invincible--;
    let dx = 0, dy = 0;
    if (input.up()) dy -= 1;
    if (input.down()) dy += 1;
    if (input.left()) dx -= 1;
    if (input.right()) dx += 1;
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    this.x = clamp(this.x + dx * this.speed, 15, W - 20);
    this.y = clamp(this.y + dy * this.speed, 15, H - HUD_H - 15);

    // 軌跡記録 (オプション追従)
    this.history.unshift({ x: this.x, y: this.y });
    if (this.history.length > 100) this.history.pop();

    // 射撃
    if (this.shootCd > 0) this.shootCd--;
    if (this.missileCd > 0) this.missileCd--;
    if (input.shoot() && this.shootCd <= 0) {
      this.fireFrom(this.x, this.y);
      for (let i = 0; i < this.options; i++) {
        const p = this.optionPos(i);
        this.fireFrom(p.x, p.y);
      }
      this.shootCd = this.weapon === 'laser' ? 9 : 8;
      if (this.weapon === 'laser') SFX.laser(); else SFX.shoot();
      if (this.hasMissile && this.missileCd <= 0) {
        game.playerBullets.push(makeBullet(this.x, this.y + 6, 4, 3, 'missile'));
        this.missileCd = 24;
        SFX.missile();
      }
    }
    // パワーアップ発動
    if (input.power() && this.gauge > 0 && !this._powerHeld) {
      this.activatePower();
    }
    this._powerHeld = input.power();
  },
  fireFrom(x, y) {
    const B = game.playerBullets;
    if (this.weapon === 'laser') {
      B.push(makeBullet(x + 14, y, 14, 0, 'laser'));
    } else if (this.weapon === 'double') {
      B.push(makeBullet(x + 14, y, 9, 0, 'shot'));
      B.push(makeBullet(x + 8, y - 8, 6.4, -6.4, 'shot'));
    } else {
      B.push(makeBullet(x + 14, y, 9, 0, 'shot'));
    }
  },
  optionPos(i) {
    const idx = Math.min((i + 1) * 14, this.history.length - 1);
    return this.history[idx] || { x: this.x, y: this.y };
  },
  activatePower() {
    const slot = POWER_SLOTS[this.gauge - 1];
    switch (slot) {
      case 'SPEED':   this.speed = Math.min(this.speed + 0.8, 8); break;
      case 'MISSILE': this.hasMissile = true; break;
      case 'DOUBLE':  this.weapon = 'double'; break;
      case 'LASER':   this.weapon = 'laser'; break;
      case 'OPTION':  if (this.options < 4) this.options++; break;
      case 'SHIELD':  this.shieldHp = 3; break;
    }
    this.gauge = 0;
    SFX.powerup();
    game.flashText = slot + ' UP!';
    game.flashTimer = 60;
  },
  hit() {
    if (this.invincible > 0 || !this.alive) return;
    if (this.shieldHp > 0) {
      this.shieldHp--;
      this.invincible = 30;
      SFX.shieldHit();
      spawnParticles(this.x + 15, this.y, 8, '#4df');
      return;
    }
    this.alive = false;
    SFX.playerDie();
    spawnParticles(this.x, this.y, 40, '#fa4');
    spawnParticles(this.x, this.y, 20, '#f44');
    game.lives--;
    if (game.lives > 0) {
      setTimeout(() => player.reset(true), 1500);
    } else {
      setTimeout(() => { game.state = 'gameover'; SFX.gameOver(); }, 1200);
    }
  },
  draw() {
    if (!this.alive) return;
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    // オプション
    for (let i = 0; i < this.options; i++) {
      const p = this.optionPos(i);
      const t = game.frame * 0.15 + i;
      ctx.fillStyle = '#f80';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fd4';
      ctx.beginPath();
      ctx.arc(p.x + Math.cos(t) * 3, p.y + Math.sin(t) * 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // 機体
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = '#8cf';
    ctx.beginPath();
    ctx.moveTo(16, 0); ctx.lineTo(-10, -9); ctx.lineTo(-5, 0); ctx.lineTo(-10, 9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-2, -3, 8, 6);
    // エンジン炎
    ctx.fillStyle = game.frame % 4 < 2 ? '#fa0' : '#f60';
    ctx.beginPath();
    ctx.moveTo(-10, -4); ctx.lineTo(-18 - Math.random() * 5, 0); ctx.lineTo(-10, 4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // シールド
    if (this.shieldHp > 0) {
      ctx.strokeStyle = `rgba(80,220,255,${0.4 + 0.2 * Math.sin(game.frame * 0.2)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 22, -1.2, 1.2);
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  },
};

// ============================================================
// 弾・敵・アイテム・パーティクル
// ============================================================
function makeBullet(x, y, vx, vy, type) {
  return { x, y, vx, vy, type, dead: false, hitSet: type === 'laser' ? new Set() : null };
}

function spawnParticles(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    game.particles.push({
      x, y,
      vx: rand(-4, 4), vy: rand(-4, 4),
      life: rand(15, 40), maxLife: 40, color,
    });
  }
}

const ENEMY_TYPES = {
  fan: { hp: 1, r: 11, score: 100 },      // サイン波で飛ぶ雑魚
  rusher: { hp: 1, r: 11, score: 150 },   // 直進 + 狙い撃ち
  tumbler: { hp: 2, r: 12, score: 200 },  // 上下バウンド
  carrier: { hp: 12, r: 22, score: 1000 },// 中型 (カプセル確定ドロップ)
};

function spawnEnemy(type, x, y, opts = {}) {
  const def = ENEMY_TYPES[type];
  game.enemies.push({
    type, x, y,
    hp: def.hp, r: def.r, score: def.score,
    t: 0, baseY: y, dead: false,
    red: opts.red || false,        // 赤い敵はカプセルを落とす
    phase: opts.phase || 0,
    vy: rand(1.5, 2.5) * (Math.random() < 0.5 ? 1 : -1),
    shootTimer: rand(60, 150),
  });
}

function updateEnemy(e) {
  e.t++;
  const spd = 1.6 + game.difficulty * 0.25;
  switch (e.type) {
    case 'fan':
      e.x -= spd * 1.3;
      e.y = e.baseY + Math.sin(e.t * 0.06 + e.phase) * 55;
      break;
    case 'rusher':
      e.x -= spd * 1.7;
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.x > player.x + 100 && e.x < W) {
        fireAimed(e, 2.6 + game.difficulty * 0.2);
        e.shootTimer = rand(90, 180) / (1 + game.difficulty * 0.15);
      }
      break;
    case 'tumbler':
      e.x -= spd;
      e.y += e.vy;
      if (e.y < 20 || e.y > H - HUD_H - 20) e.vy *= -1;
      break;
    case 'carrier':
      e.x -= spd * 0.55;
      e.y = e.baseY + Math.sin(e.t * 0.02) * 30;
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.x < W) {
        for (let a = -1; a <= 1; a++) fireAimed(e, 2.4, a * 0.3);
        e.shootTimer = 100 / (1 + game.difficulty * 0.1);
      }
      break;
  }
  if (e.x < -40) e.dead = true;
}

function fireAimed(e, speed, angleOff = 0) {
  if (!player.alive) return;
  const ang = Math.atan2(player.y - e.y, player.x - e.x) + angleOff;
  game.enemyBullets.push({
    x: e.x, y: e.y,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    dead: false,
  });
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const body = e.red ? '#f55' : { fan: '#a7f', rusher: '#5da', tumbler: '#fa5', carrier: '#77e' }[e.type];
  if (e.type === 'carrier') {
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.ellipse(0, 0, 24, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#aaf';
    ctx.beginPath();
    ctx.ellipse(-4, -4, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = game.frame % 20 < 10 ? '#ff0' : '#f80';
    ctx.fillRect(-20, 10, 6, 3); ctx.fillRect(14, 10, 6, 3);
  } else {
    ctx.rotate(e.t * 0.08);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.lineTo(0, -11); ctx.lineTo(11, 0); ctx.lineTo(0, 11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// ゲーム本体
// ============================================================
const game = {
  state: 'title',
  frame: 0, score: 0, hiScore: parseInt(localStorage.getItem('cg_hiscore') || '0'),
  lives: 3, difficulty: 0,
  playerBullets: [], enemyBullets: [], enemies: [], capsules: [], particles: [],
  stars: [], spawnTimer: 60, carrierTimer: 1500,
  flashText: '', flashTimer: 0,

  init() {
    for (let i = 0; i < 90; i++) {
      this.stars.push({
        x: Math.random() * W, y: Math.random() * (H - HUD_H),
        z: Math.random(), // 0=遠い 1=近い
      });
    }
  },
  start() {
    this.reset();
    SFX.gameStart();
  },
  reset() {
    this.state = 'play';
    this.score = 0; this.lives = 3; this.frame = 0; this.difficulty = 0;
    this.playerBullets = []; this.enemyBullets = []; this.enemies = [];
    this.capsules = []; this.particles = [];
    this.spawnTimer = 60; this.carrierTimer = 1200;
    this.flashTimer = 0;
    player.reset(true);
  },
  addScore(n) {
    this.score += n;
    if (this.score > this.hiScore) {
      this.hiScore = this.score;
      localStorage.setItem('cg_hiscore', String(this.hiScore));
    }
  },

  spawnWave() {
    const roll = Math.random();
    const y = rand(60, H - HUD_H - 60);
    if (roll < 0.4) {
      // 編隊 (2割で赤編隊 = カプセル持ち)
      const red = Math.random() < 0.35;
      const n = 5;
      for (let i = 0; i < n; i++) {
        setTimeout(() => {
          if (this.state === 'play') spawnEnemy('fan', W + 30, y, { red, phase: 0 });
        }, i * 220);
      }
    } else if (roll < 0.7) {
      spawnEnemy('rusher', W + 30, y, { red: Math.random() < 0.25 });
      if (this.difficulty > 1) spawnEnemy('rusher', W + 70, clamp(y + rand(-80, 80), 40, H - HUD_H - 40));
    } else {
      spawnEnemy('tumbler', W + 30, y, { red: Math.random() < 0.25 });
    }
  },

  update() {
    this.frame++;
    // 星背景スクロール
    for (const s of this.stars) {
      s.x -= (0.4 + s.z * 2.2) * (this.state === 'play' ? 1 : 0.4);
      if (s.x < 0) { s.x = W; s.y = Math.random() * (H - HUD_H); }
    }
    if (this.state !== 'play') return;

    this.difficulty = Math.min(this.frame / 1800, 5); // 30秒ごとに難度+1
    player.update();

    // 敵スポーン
    if (--this.spawnTimer <= 0) {
      this.spawnWave();
      this.spawnTimer = Math.max(30, 90 - this.difficulty * 12);
    }
    if (--this.carrierTimer <= 0) {
      spawnEnemy('carrier', W + 40, rand(80, H - HUD_H - 80));
      this.carrierTimer = 1300;
    }

    // 自弾
    for (const b of this.playerBullets) {
      b.x += b.vx; b.y += b.vy;
      if (b.type === 'missile') b.vy += 0.12;
      if (b.x > W + 40 || b.y > H || b.y < -20) b.dead = true;
    }
    // 敵弾
    for (const b of this.enemyBullets) {
      b.x += b.vx; b.y += b.vy;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.dead = true;
    }
    // 敵
    for (const e of this.enemies) updateEnemy(e);
    // カプセル
    for (const c of this.capsules) {
      c.x -= 1.2;
      c.t++;
      if (c.x < -20) c.dead = true;
    }
    // パーティクル
    for (const p of this.particles) {
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life--;
    }

    this.collide();

    this.playerBullets = this.playerBullets.filter(b => !b.dead);
    this.enemyBullets = this.enemyBullets.filter(b => !b.dead);
    this.enemies = this.enemies.filter(e => !e.dead);
    this.capsules = this.capsules.filter(c => !c.dead);
    this.particles = this.particles.filter(p => p.life > 0);
    if (this.flashTimer > 0) this.flashTimer--;
  },

  collide() {
    // 自弾 vs 敵
    for (const b of this.playerBullets) {
      if (b.dead) continue;
      for (const e of this.enemies) {
        if (e.dead) continue;
        const rr = (e.r + 6) ** 2;
        if (dist2(b, e) < rr) {
          if (b.type === 'laser') {
            if (b.hitSet.has(e)) continue;
            b.hitSet.add(e);
          } else {
            b.dead = true;
          }
          e.hp -= b.type === 'laser' ? 2 : 1;
          spawnParticles(b.x, b.y, 3, '#ff8');
          if (e.hp <= 0) {
            e.dead = true;
            this.addScore(e.score);
            spawnParticles(e.x, e.y, e.type === 'carrier' ? 35 : 14, e.red ? '#f66' : '#fc6');
            if (e.type === 'carrier') SFX.bigBoom(); else SFX.boom();
            if (e.red || e.type === 'carrier') {
              this.capsules.push({ x: e.x, y: e.y, t: 0, dead: false });
            }
          }
          if (b.dead) break;
        }
      }
    }
    // プレイヤー vs 敵弾・敵・カプセル
    if (player.alive) {
      const pr = { x: player.x, y: player.y };
      for (const b of this.enemyBullets) {
        if (!b.dead && dist2(b, pr) < (player.r + 4) ** 2) {
          b.dead = true;
          player.hit();
        }
      }
      for (const e of this.enemies) {
        if (!e.dead && dist2(e, pr) < (player.r + e.r) ** 2) {
          e.hp -= 3;
          if (e.hp <= 0) { e.dead = true; spawnParticles(e.x, e.y, 12, '#fc6'); }
          player.hit();
        }
      }
      for (const c of this.capsules) {
        if (!c.dead && dist2(c, pr) < 24 ** 2) {
          c.dead = true;
          player.gauge = player.gauge % POWER_SLOTS.length + 1;
          SFX.pickup();
          this.addScore(500);
          spawnParticles(c.x, c.y, 10, '#fd4');
        }
      }
    }
  },

  // ---------- 描画 ----------
  draw() {
    ctx.fillStyle = '#020210';
    ctx.fillRect(0, 0, W, H);
    // 星
    for (const s of this.stars) {
      const b = 0.3 + s.z * 0.7;
      ctx.fillStyle = `rgba(${180 + s.z * 75},${190 + s.z * 65},255,${b})`;
      ctx.fillRect(s.x, s.y, s.z > 0.7 ? 2 : 1, s.z > 0.7 ? 2 : 1);
    }

    if (this.state === 'title') { this.drawTitle(); return; }

    // カプセル
    for (const c of this.capsules) {
      const blink = Math.floor(c.t / 6) % 2 === 0;
      ctx.save();
      ctx.translate(c.x, c.y + Math.sin(c.t * 0.1) * 3);
      ctx.fillStyle = blink ? '#f80' : '#fc0';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-11, -7, 22, 14, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('P', 0, 4);
      ctx.restore();
    }

    // 自弾
    for (const b of this.playerBullets) {
      if (b.type === 'laser') {
        ctx.fillStyle = '#6df';
        ctx.fillRect(b.x - 20, b.y - 2, 36, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(b.x - 20, b.y - 1, 36, 2);
      } else if (b.type === 'missile') {
        ctx.fillStyle = '#faa';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f80';
        ctx.fillRect(b.x - 7, b.y - 1.5, 5, 3);
      } else {
        ctx.fillStyle = '#ffd';
        ctx.fillRect(b.x - 6, b.y - 2, 12, 4);
      }
    }
    // 敵弾
    for (const b of this.enemyBullets) {
      ctx.fillStyle = this.frame % 6 < 3 ? '#f6a' : '#fda';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const e of this.enemies) drawEnemy(e);
    player.draw();

    // パーティクル
    for (const p of this.particles) {
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    this.drawHUD();

    if (this.flashTimer > 0) {
      ctx.fillStyle = `rgba(255,230,80,${Math.min(1, this.flashTimer / 30)})`;
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(this.flashText, W / 2, H / 2 - 80);
    }

    if (this.state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f55';
      ctx.font = 'bold 48px monospace';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '20px monospace';
      ctx.fillText(`SCORE: ${this.score}`, W / 2, H / 2 + 25);
      ctx.fillStyle = '#8cf';
      ctx.font = '16px monospace';
      if (this.frame % 60 < 40) ctx.fillText('ENTERキーでリトライ', W / 2, H / 2 + 65);
    }
  },

  drawHUD() {
    // 上部: スコア
    ctx.textAlign = 'left';
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE ${String(this.score).padStart(7, '0')}`, 12, 20);
    ctx.fillStyle = '#fc6';
    ctx.fillText(`HI ${String(this.hiScore).padStart(7, '0')}`, 220, 20);
    // 残機
    for (let i = 0; i < this.lives - 1; i++) {
      ctx.save();
      ctx.translate(W - 30 - i * 26, 15);
      ctx.scale(0.7, 0.7);
      ctx.fillStyle = '#8cf';
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-8, -7); ctx.lineTo(-8, 7);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // 下部: パワーゲージ
    ctx.fillStyle = '#101028';
    ctx.fillRect(0, H - HUD_H, W, HUD_H);
    ctx.strokeStyle = '#334';
    ctx.strokeRect(0.5, H - HUD_H + 0.5, W - 1, HUD_H - 1);
    const slotW = 110, gap = 8;
    const totalW = POWER_SLOTS.length * slotW + (POWER_SLOTS.length - 1) * gap;
    const startX = (W - totalW) / 2;
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    POWER_SLOTS.forEach((name, i) => {
      const x = startX + i * (slotW + gap);
      const selected = player.gauge === i + 1;
      ctx.fillStyle = selected
        ? (this.frame % 20 < 10 ? '#fa0' : '#fc4')
        : '#1a1a3a';
      ctx.beginPath();
      ctx.roundRect(x, H - HUD_H + 7, slotW, HUD_H - 14, 4);
      ctx.fill();
      ctx.strokeStyle = selected ? '#ff8' : '#446';
      ctx.stroke();
      ctx.fillStyle = selected ? '#000' : '#9ab';
      ctx.fillText(name, x + slotW / 2, H - HUD_H / 2 + 4);
    });
  },

  drawTitle() {
    ctx.textAlign = 'center';
    const t = this.frame;
    // タイトルロゴ
    ctx.save();
    ctx.translate(W / 2, 130 + Math.sin(t * 0.03) * 6);
    ctx.fillStyle = '#4df';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('COSMIC GRADIUS', 0, 0);
    ctx.fillStyle = 'rgba(140,200,255,0.35)';
    ctx.fillText('COSMIC GRADIUS', 3, 3);
    ctx.restore();
    ctx.fillStyle = '#fc6';
    ctx.font = '16px monospace';
    ctx.fillText('- パワーアップ横スクロールシューティング -', W / 2, 175);

    ctx.fillStyle = '#fff';
    ctx.font = '15px monospace';
    ctx.fillText('移動: 矢印キー / WASD', W / 2, 240);
    ctx.fillText('ショット: Z または スペース', W / 2, 265);
    ctx.fillText('パワーアップ発動: X または Shift', W / 2, 290);
    ctx.fillStyle = '#fc0';
    ctx.font = '14px monospace';
    ctx.fillText('赤い敵を倒してカプセルを集め、Xでパワーアップ!', W / 2, 330);

    if (t % 60 < 40) {
      ctx.fillStyle = '#8f8';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('ENTERキー / クリック でスタート', W / 2, 390);
    }
    ctx.fillStyle = '#667';
    ctx.font = '12px monospace';
    ctx.fillText(`HI-SCORE ${String(this.hiScore).padStart(7, '0')}`, W / 2, 425);
  },
};

// ============================================================
// メインループ
// ============================================================
game.init();
function loop() {
  game.update();
  game.draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
