<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>ちゅらツム 〜おきなわぱずる〜</title>
<style>

<body>
<canvas id="game" width="480" height="720"></canvas>
<div id="nameOverlay">
  <div id="nameCard">

    <input id="nameInput" maxlength="8" placeholder="なまえ (8もじまで)">

<script>
'use strict';

/* =========================================================
   ちゅらツム 〜おきなわぱずる〜
   ツムツム風・なぞってつなげるパズル。沖縄の仲間たちと
   琉球音階(ド・ミ・ファ・ソ・シ)のBGMで遊ぶ癒し系ゲーム。
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 720;

// ---------- ゲーム定数 ----------
const R = 34;                 // ツムの半径
const TSUM_COUNT = 42;        // 画面内のツム数
const LINK_DIST = R * 2 * 1.28; // チェーン接続できる距離
const GAME_TIME = 60;         // 制限時間(秒)
const FEVER_MAX = 34;         // フィーバーに必要な消去数
const FEVER_TIME = 8;         // フィーバー継続秒
const GRAV = 1500;            // 重力
const FLOOR_Y = H - 26;       // 床
const CEIL_SPAWN = -R * 2;    // 出現位置

// ---------- キャラクター定義 ----------
const CHARS = [
  { id: 0, name: 'シーサーくん',   color: '#e8734a', dark: '#c14f2b' },
  { id: 1, name: 'ゴーヤぼうや',   color: '#6abf5e', dark: '#4a9840' },
  { id: 2, name: 'じんべえちゃん', color: '#5aa7d6', dark: '#3f7fae' },
  { id: 3, name: 'はいびーちゃん', color: '#ef6da3', dark: '#cf4a83' },
  { id: 4, name: 'かめたろう',     color: '#4fc2b0', dark: '#379a8b' },
];
const BUBBLE_TYPE = -1; // 7チェーン以上で出るシャボン玉ボーナス
const HABU_TYPE = -2;   // おじゃまツム(ハブ)。つなげない。シャボン玉か台風で退治
const HABU_MAX = 3;     // 画面内のハブ上限
const COMBO_WINDOW = 2.5;   // コンボが途切れるまでの秒数
const COMBO_MULT_MAX = 3;   // コンボ倍率の上限
const RHYTHM_WINDOW = 0.09; // エイサーリズムボーナスの判定幅(秒)

// ---------- 状態 ----------
let state = 'title';   // title / play / result
let tsums = [];
let chain = [];
let dragging = false;
let pointer = { x: 0, y: 0 };
let score = 0;
let best = Number(localStorage.getItem('churatsum-best') || 0);
let timeLeft = GAME_TIME;
let feverGauge = 0;
let fever = false;
let feverT = 0;
let particles = [];
let floats = [];        // 浮かぶスコア文字
let shakeT = 0;
let globalT = 0;
let resultDelay = 0;
let lastStamp = performance.now();
let combo = 0, comboTimer = 0, comboPopT = 0, maxCombo = 0;
let playElapsed = 0;
let typhoon = { state: 'none', t: 0, at: 0, done: false };
let beatRef = 0, beatInt = 0;   // エイサーのビート基準時刻と間隔
let pendingRank = false;
let newRankIdx = -1;
let ranking = [];
try { ranking = JSON.parse(localStorage.getItem('churatsum-rank') || '[]'); } catch (e) { ranking = []; }
if (ranking.length === 0 && best > 0) {
  ranking = [{ n: 'ベストきろく', s: best }];
  localStorage.setItem('churatsum-rank', JSON.stringify(ranking));
}

// =========================================================
// キャラクター描画(オフスクリーンに事前レンダリング)
// =========================================================
function makeSprite(drawFn) {
  const s = R * 2 + 24;
  const c = document.createElement('canvas');
  c.width = c.height = s * 2;
  const g = c.getContext('2d');
  g.scale(2, 2);
  g.translate(s / 2, s / 2);
  drawFn(g);
  return c;
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) + 255 * amt);
  const gr = Math.min(255, ((n >> 8) & 255) + 255 * amt);
  const b = Math.min(255, (n & 255) + 255 * amt);
  return `rgb(${r|0},${gr|0},${b|0})`;
}

function ball(g, color, dark, ry) {
  ry = ry || R;
  const grad = g.createRadialGradient(-R * 0.3, -ry * 0.35, R * 0.2, 0, 0, R * 1.15);
  grad.addColorStop(0, lighten(color, 0.22));
  grad.addColorStop(0.75, color);
  grad.addColorStop(1, dark);
  g.fillStyle = grad;
  g.beginPath();
  g.ellipse(0, 0, R, ry, 0, 0, Math.PI * 2);
  g.fill();
}

function face(g, opt) {
  opt = opt || {};
  const ey = opt.eyeY !== undefined ? opt.eyeY : -4;
  const ex = opt.eyeX || 11;
  const er = opt.eyeR || 5.5;
  // 目
  for (const s of [-1, 1]) {
    g.fillStyle = '#3a2a22';
    g.beginPath(); g.arc(s * ex, ey, er, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(s * ex - er * 0.3, ey - er * 0.35, er * 0.32, 0, Math.PI * 2); g.fill();
  }
  // ほっぺ
  g.fillStyle = 'rgba(255,120,120,0.45)';
  for (const s of [-1, 1]) {
    g.beginPath(); g.ellipse(s * (ex + 8), ey + 9, 5.5, 3.8, 0, 0, Math.PI * 2); g.fill();
  }
  // くち
  g.strokeStyle = '#3a2a22'; g.lineWidth = 2; g.lineCap = 'round';
  if (opt.mouth === 'wide') {
    g.beginPath(); g.arc(0, ey + 8, 9, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  } else if (opt.mouth === 'open') {
    g.fillStyle = '#7a3b32';
    g.beginPath(); g.arc(0, ey + 10, 4.5, 0, Math.PI * 2); g.fill();
  } else {
    g.beginPath(); g.arc(-3, ey + 9, 3.5, 0.1 * Math.PI, 0.95 * Math.PI); g.stroke();
    g.beginPath(); g.arc(3, ey + 9, 3.5, 0.05 * Math.PI, 0.9 * Math.PI); g.stroke();
  }
}

// --- シーサー ---
function drawShisa(g) {
  const c = CHARS[0];
  // たてがみ(くるくる)
  g.fillStyle = '#a8552e';
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * (1.06 + i * 0.11);
    g.beginPath();
    g.arc(Math.cos(a) * R * 0.92, Math.sin(a) * R * 0.92, 9.5, 0, Math.PI * 2);
    g.fill();
  }
  // 耳
  g.fillStyle = c.dark;
  for (const s of [-1, 1]) {
    g.beginPath(); g.ellipse(s * R * 0.78, -R * 0.62, 8, 10, s * 0.5, 0, Math.PI * 2); g.fill();
  }
  ball(g, c.color, c.dark);
  // まゆげ(うずまき風)
  g.strokeStyle = '#8a3f1e'; g.lineWidth = 2.5; g.lineCap = 'round';
  for (const s of [-1, 1]) {
    g.beginPath(); g.arc(s * 11, -14, 5, Math.PI * 1.1, Math.PI * 2.2); g.stroke();
  }
  face(g, { mouth: 'open' });
  // きば
  g.fillStyle = '#fff';
  for (const s of [-1, 1]) {
    g.beginPath();
    g.moveTo(s * 6, 4); g.lineTo(s * 8.5, 10); g.lineTo(s * 3.5, 7.5);
    g.closePath(); g.fill();
  }
}

// --- ゴーヤ ---
function drawGoya(g) {
  const c = CHARS[1];
  ball(g, c.color, c.dark, R * 1.04);
  // イボイボ
  g.fillStyle = 'rgba(255,255,255,0.28)';
  const bumps = [[-18,-20],[2,-26],[20,-16],[-26,2],[27,6],[-16,22],[8,26],[24,-2],[-6,-8],[14,10],[-24,-12]];
  for (const [bx, by] of bumps) {
    g.beginPath(); g.arc(bx, by, 4.4, 0, Math.PI * 2); g.fill();
  }
  // 芽とつる
  g.strokeStyle = '#3f8a35'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -R + 2); g.quadraticCurveTo(6, -R - 8, 2, -R - 13); g.stroke();
  g.fillStyle = '#7fd06f';
  g.beginPath(); g.ellipse(-6, -R - 10, 7, 4.5, -0.5, 0, Math.PI * 2); g.fill();
  face(g, {});
}

// --- ジンベエザメ ---
function drawJinbei(g) {
  const c = CHARS[2];
  // 背びれ
  g.fillStyle = c.dark;
  g.beginPath();
  g.moveTo(-4, -R + 6); g.quadraticCurveTo(2, -R - 14, 12, -R + 2);
  g.closePath(); g.fill();
  // 胸びれ
  for (const s of [-1, 1]) {
    g.beginPath();
    g.ellipse(s * R * 0.92, 14, 10, 6, s * 0.6, 0, Math.PI * 2); g.fill();
  }
  ball(g, c.color, c.dark);
  // おなか(白)
  g.fillStyle = '#f3f8fb';
  g.beginPath();
  g.ellipse(0, R * 0.62, R * 0.78, R * 0.5, 0, 0, Math.PI * 2);
  g.fill();
  // 白い星もよう
  g.fillStyle = 'rgba(255,255,255,0.85)';
  const spots = [[-20,-16],[-4,-24],[14,-18],[24,-6],[-26,-2],[6,-10],[-12,-4],[18,4],[-22,10]];
  for (const [sx, sy] of spots) {
    g.beginPath(); g.arc(sx, sy, 2.6, 0, Math.PI * 2); g.fill();
  }
  face(g, { eyeX: 15, eyeY: 0, eyeR: 4.5, mouth: 'wide' });
}

// --- ハイビスカス ---
function drawHibi(g) {
  const c = CHARS[3];
  // 花びら
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const grad = g.createRadialGradient(0, 0, R * 0.3, Math.cos(a) * R, Math.sin(a) * R, R * 0.7);
    grad.addColorStop(0, '#ff9ec4');
    grad.addColorStop(1, c.color);
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62, R * 0.55, R * 0.42, a, 0, Math.PI * 2);
    g.fill();
  }
  // 中心のお顔
  ball(g, '#ffd98e', '#f0b95e', R * 0.66);
  // めしべ
  g.strokeStyle = '#e8b23a'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(14, -R * 0.5); g.quadraticCurveTo(24, -R * 0.85, 27, -R * 1.02); g.stroke();
  g.fillStyle = '#ffe27a';
  for (let i = 0; i < 3; i++) {
    g.beginPath(); g.arc(24 + i * 3 - 3, -R * 1.0 - i * 2 + 2, 2.6, 0, Math.PI * 2); g.fill();
  }
  face(g, { eyeX: 9, eyeY: -2, eyeR: 4.5 });
}

// --- ウミガメ ---
function drawKame(g) {
  const c = CHARS[4];
  // 手足ひれ
  g.fillStyle = '#8ed9a8';
  for (const s of [-1, 1]) {
    g.beginPath(); g.ellipse(s * R * 0.9, 18, 10, 6.5, s * 0.5, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(s * R * 0.7, -R * 0.75, 8, 6, s * -0.4, 0, Math.PI * 2); g.fill();
  }
  ball(g, c.color, c.dark);
  // こうら(水玉もようで可愛く)
  const shellY = -R * 0.3;
  g.fillStyle = 'rgba(38,128,112,0.85)';
  g.beginPath(); g.ellipse(0, shellY, R * 0.78, R * 0.52, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2.5;
  g.beginPath(); g.ellipse(0, shellY, R * 0.78, R * 0.52, 0, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(255,235,150,0.75)';
  const dots = [[0, -4], [-14, 2], [14, 2], [-7, -12], [7, -12], [0, 8]];
  for (const [dx, dy] of dots) {
    g.beginPath(); g.arc(dx, shellY + dy, 3.6, 0, Math.PI * 2); g.fill();
  }
  face(g, { eyeY: 8, eyeX: 10, eyeR: 5 });
}

// --- ハブ(おじゃまツム) ---
function drawHabu(g) {
  ball(g, '#b3985a', '#8a7440');
  // とぐろ
  g.strokeStyle = 'rgba(122,98,48,0.8)'; g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.arc(0, 6, R * 0.62, 0.2, Math.PI - 0.2); g.stroke();
  g.beginPath(); g.arc(0, 2, R * 0.38, 0.4, Math.PI - 0.4); g.stroke();
  // ひし形もよう
  g.fillStyle = 'rgba(96,74,30,0.65)';
  const dm = [[-20, -14], [0, -22], [20, -14], [-10, -4], [10, -4]];
  for (const [dx, dy] of dm) {
    g.beginPath();
    g.moveTo(dx, dy - 5); g.lineTo(dx + 5, dy); g.lineTo(dx, dy + 5); g.lineTo(dx - 5, dy);
    g.closePath(); g.fill();
  }
  // しっぽ
  g.strokeStyle = '#8a7440'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(R * 0.7, 16); g.quadraticCurveTo(R * 1.05, 8, R * 0.95, -4); g.stroke();
  // ジト目と怒りまゆ
  g.fillStyle = '#3a2a22';
  for (const s of [-1, 1]) { g.beginPath(); g.ellipse(s * 11, -2, 5.5, 3, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#fff';
  for (const s of [-1, 1]) { g.beginPath(); g.arc(s * 11 - 1.5, -3.5, 1.4, 0, Math.PI * 2); g.fill(); }
  g.strokeStyle = '#3a2a22'; g.lineWidth = 2.5; g.lineCap = 'round';
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(s * 6, -11); g.lineTo(s * 16, -7); g.stroke(); }
  // ちろちろした舌
  g.strokeStyle = '#e05555'; g.lineWidth = 2.5;
  g.beginPath();
  g.moveTo(0, 10); g.lineTo(0, 17);
  g.moveTo(0, 17); g.lineTo(-3, 21);
  g.moveTo(0, 17); g.lineTo(3, 21);
  g.stroke();
}

const SPRITES = [drawShisa, drawGoya, drawJinbei, drawHibi, drawKame].map(makeSprite);
const HABU_SPRITE = makeSprite(drawHabu);

// ---------- キャラ固有スキル ----------
const SKILL_NEED = 10; // 発動に必要な同キャラ消去数
const SKILLS = [
  { name: 'まよけの ほうこう!', desc: 'まんなかの たてれつを けす' },
  { name: 'にがみパワー!',       desc: 'フィーバーゲージ アップ' },
  { name: 'おおきなくちで ぱくり!', desc: 'したの だんを たべる' },
  { name: 'はなふぶき!',         desc: '5こを ハイビスカスに かえる' },
  { name: 'ゆったりタイム!',     desc: 'じかん +3びょう' },
];
let skillGauge = [0, 0, 0, 0, 0];
let skillFlashT = 0;

// =========================================================
// サウンド(Web Audio・琉球音階)
// =========================================================
let AC = null, masterGain = null, bgmGain = null, bgmTimer = null;
let bgmStep = 0, nextNoteTime = 0;
const BPM = 128;

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = 0.5;
  masterGain.connect(AC.destination);
  bgmGain = AC.createGain(); bgmGain.gain.value = 0.55;
  bgmGain.connect(masterGain);
}

function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// 三線っぽいポロンとした音
function pluck(midi, t, vel, dest) {
  if (!AC) return;
  dest = dest || masterGain;
  const f = midiFreq(midi);
  const o1 = AC.createOscillator(); o1.type = 'triangle'; o1.frequency.value = f;
  const o2 = AC.createOscillator(); o2.type = 'square'; o2.frequency.value = f * 2;
  const g1 = AC.createGain(), g2 = AC.createGain();
  const bp = AC.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = 2600;
  g1.gain.setValueAtTime(vel, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
  g2.gain.setValueAtTime(vel * 0.18, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o1.connect(g1); o2.connect(g2);
  g1.connect(bp); g2.connect(bp); bp.connect(dest);
  o1.start(t); o2.start(t);
  o1.stop(t + 0.4); o2.stop(t + 0.4);
}

function drum(t, freq, vel, dest) {
  if (!AC) return;
  const o = AC.createOscillator(); o.type = 'sine';
  const g = AC.createGain();
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.4, t + 0.12);
  g.gain.setValueAtTime(vel, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(dest || masterGain);
  o.start(t); o.stop(t + 0.2);
}

function shaker(t, vel, dest) {
  if (!AC) return;
  const len = 0.05, buf = AC.createBuffer(1, AC.sampleRate * len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = AC.createBufferSource(); src.buffer = buf;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
  const g = AC.createGain(); g.gain.value = vel;
  src.connect(hp); hp.connect(g); g.connect(dest || masterGain);
  src.start(t);
}

// --- BGM:琉球音階(C E F G B)のオリジナル島うたループ ---
// 8小節 x 8分音符 = 64ステップ(0は休符)
const MELODY = [
  76,79,83,79, 76,79,77,76,  72,76,77,76, 72, 0,67,71,
  72,72,76,77, 79,79,77,76,  77,76,72,71, 72, 0, 0, 0,
  79,79,83,84, 83,79,76,79,  77,77,79,77, 76,72,76,77,
  76,72,71,67, 71,72,76,77,  76, 0,72, 0, 72, 0, 0, 0,
];
// 小節ごとのベース(ルート音)
const BASSROOT = [48, 48, 53, 48, 55, 53, 55, 48];

function scheduleBGM() {
  if (!AC || state !== 'play') return;
  const stepDur = 60 / BPM / 2; // 8分音符
  while (nextNoteTime < AC.currentTime + 0.15) {
    const s = bgmStep % 64;
    const t = nextNoteTime;
    const m = MELODY[s];
    if (m) pluck(m, t, 0.22, bgmGain);
    // ベース(4分) + エイサーのビート基準を記録
    if (s % 2 === 0) {
      beatRef = t;
      beatInt = stepDur * 2 * (fever ? 0.85 : 1);
      const bar = Math.floor(s / 8);
      const beat = Math.floor((s % 8) / 2);
      const root = BASSROOT[bar];
      pluck(beat === 2 ? root + 7 : root, t, 0.16, bgmGain);
    }
    // 太鼓 & シェイカー
    if (s % 8 === 0) drum(t, 150, 0.5, bgmGain);
    if (s % 8 === 4) drum(t, 120, 0.4, bgmGain);
    shaker(t, s % 2 === 0 ? 0.06 : 0.12, bgmGain);
    nextNoteTime += stepDur * (fever ? 0.85 : 1);
    bgmStep++;
  }
}

function startBGM() {
  if (!AC) return;
  stopBGM();
  bgmStep = 0;
  nextNoteTime = AC.currentTime + 0.1;
  bgmTimer = setInterval(scheduleBGM, 40);
}
function stopBGM() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

// --- 効果音 ---
const RYUKYU = [72, 76, 77, 79, 83, 84, 88, 89, 91, 95, 96];
function sePop(i) {
  if (!AC) return;
  const n = RYUKYU[Math.min(i, RYUKYU.length - 1)];
  pluck(n, AC.currentTime, 0.5);
}
function seChainDone(n) {
  if (!AC) return;
  const t = AC.currentTime;
  const notes = n >= 7 ? [72, 76, 79, 84, 88] : [72, 79, 84];
  notes.forEach((m, i) => pluck(m, t + i * 0.06, 0.4));
}
function seBubble() {
  if (!AC) return;
  const t = AC.currentTime;
  [84, 83, 79, 76, 72, 76, 79, 84].forEach((m, i) => pluck(m, t + i * 0.045, 0.35));
  drum(t, 200, 0.6);
}
function seFever() {
  if (!AC) return;
  const t = AC.currentTime;
  [72, 76, 79, 84, 88, 91, 95, 96].forEach((m, i) => pluck(m, t + i * 0.07, 0.5));
  drum(t, 180, 0.7); drum(t + 0.3, 150, 0.7);
}
function seStart() {
  if (!AC) return;
  const t = AC.currentTime;
  [72, 77, 79, 84].forEach((m, i) => pluck(m, t + i * 0.09, 0.5));
}
function seEnd() {
  if (!AC) return;
  const t = AC.currentTime;
  [84, 79, 77, 76, 72].forEach((m, i) => pluck(m, t + i * 0.16, 0.45));
  [72, 76, 79, 84].forEach(m => pluck(m, t + 0.9, 0.4));
}
function hiss(dur, vel, freq) {
  if (!AC) return;
  const t = AC.currentTime;
  const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = AC.createBufferSource(); src.buffer = buf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq || 4000; bp.Q.value = 0.7;
  const g = AC.createGain(); g.gain.value = vel;
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t);
}
function seHabu() { if (!AC) return; hiss(0.3, 0.3, 4500); drum(AC.currentTime, 80, 0.35); }
function seTyphoonWarn() {
  if (!AC) return;
  const t = AC.currentTime;
  [67, 60, 67, 60].forEach((m, i) => pluck(m, t + i * 0.18, 0.45));
}
function seWind() { hiss(2.0, 0.3, 900); }
function seDon() {
  if (!AC) return;
  const t = AC.currentTime;
  drum(t, 85, 0.9); drum(t + 0.02, 60, 0.5); hiss(0.06, 0.15, 3000);
}
function seSkill() {
  if (!AC) return;
  const t = AC.currentTime;
  [72, 79, 84, 91].forEach((m, i) => pluck(m, t + i * 0.06, 0.5));
  drum(t, 120, 0.6);
}

// =========================================================
// ツム(物理)
// =========================================================
function newTsum(x, y, type) {
  return {
    x, y,
    vx: (Math.random() - 0.5) * 60,
    vy: 0,
    type: type !== undefined ? type : (Math.random() * CHARS.length) | 0,
    phase: Math.random() * Math.PI * 2,
    sel: false,
    popT: 0, // 消えるアニメ経過
  };
}

function fillTsums() {
  tsums = [];
  for (let i = 0; i < TSUM_COUNT; i++) {
    tsums.push(newTsum(
      R + Math.random() * (W - R * 2),
      CEIL_SPAWN - i * 24
    ));
  }
}

function spawnTsums(n) {
  for (let i = 0; i < n; i++) {
    tsums.push(newTsum(
      R + Math.random() * (W - R * 2),
      CEIL_SPAWN - i * (R * 1.4) - Math.random() * 30
    ));
  }
}

function physics(dt) {
  for (const t of tsums) {
    if (t.popT > 0) continue;
    t.vy += GRAV * dt;
    t.x += t.vx * dt;
    t.y += t.vy * dt;
    t.vx *= 0.985;
    // 壁と床
    if (t.x < R) { t.x = R; t.vx *= -0.3; }
    if (t.x > W - R) { t.x = W - R; t.vx *= -0.3; }
    if (t.y > FLOOR_Y - R) { t.y = FLOOR_Y - R; t.vy *= -0.12; t.vx *= 0.9; }
  }
  // ツム同士の衝突(位置補正)
  for (let iter = 0; iter < 3; iter++) {
    for (let i = 0; i < tsums.length; i++) {
      const a = tsums[i];
      if (a.popT > 0) continue;
      for (let j = i + 1; j < tsums.length; j++) {
        const b = tsums[j];
        if (b.popT > 0) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        const min = R * 2 * 0.96;
        if (d2 < min * min && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const overlap = (min - d) / 2;
          dx /= d; dy /= d;
          a.x -= dx * overlap; a.y -= dy * overlap;
          b.x += dx * overlap; b.y += dy * overlap;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * dx + rvy * dy;
          if (vn < 0) {
            const imp = vn * 0.4;
            a.vx += dx * imp; a.vy += dy * imp;
            b.vx -= dx * imp; b.vy -= dy * imp;
          }
        }
      }
    }
  }
}

// =========================================================
// チェーン操作
// =========================================================
function tsumAt(x, y, slack) {
  slack = slack || 1.05;
  let bestT = null, bestD = 1e9;
  for (const t of tsums) {
    if (t.popT > 0) continue;
    const d = Math.hypot(t.x - x, t.y - y);
    if (d < R * slack && d < bestD) { bestD = d; bestT = t; }
  }
  return bestT;
}

function tryExtendChain() {
  const t = tsumAt(pointer.x, pointer.y, 1.15);
  if (!t) return;
  const last = chain[chain.length - 1];
  // ひとつ前に戻ったらチェーンを1つ解除
  if (chain.length >= 2 && t === chain[chain.length - 2]) {
    last.sel = false;
    chain.pop();
    sePop(chain.length - 1);
    return;
  }
  if (t.sel || t.type !== last.type) return;
  if (Math.hypot(t.x - last.x, t.y - last.y) > LINK_DIST) return;
  t.sel = true;
  chain.push(t);
  sePop(chain.length - 1);
}

function releaseChain() {
  if (chain.length >= 3) {
    popChain(chain);
  } else {
    for (const t of chain) t.sel = false;
  }
  chain = [];
}

function chainCenter(list) {
  return {
    x: list.reduce((s, t) => s + t.x, 0) / list.length,
    y: list.reduce((s, t) => s + t.y, 0) / list.length,
  };
}

// コンボを1つ進めて現在の倍率を返す
function bumpCombo() {
  combo++;
  comboTimer = COMBO_WINDOW;
  comboPopT = 0.3;
  if (combo > maxCombo) maxCombo = combo;
  if (combo >= 5 && combo % 5 === 0) {
    floats.push({ x: W / 2, y: 200, text: `ちばりよ〜! ${combo}コンボ!`, life: 1.4, color: '#ffb13e', size: 28 });
  }
  return Math.min(COMBO_MULT_MAX, 1 + (combo - 1) * 0.1);
}

// うちなーぐちで ほめる
function praise(n, c) {
  let msg = null;
  if (n >= 10) msg = 'まさかやー!!';
  else if (n >= 8) msg = 'あきさみよー!';
  else if (n >= 6) msg = 'でーじ じょうとう!';
  else if (n >= 4) msg = 'じょうとう!';
  if (msg) floats.push({ x: c.x, y: c.y - 36, text: msg, life: 1.3, color: '#fff', size: 24 });
}

// エイサーの太鼓の拍に合っていたらtrue
function onEisaBeat() {
  if (!AC || beatInt <= 0) return false;
  const d = ((AC.currentTime - beatRef) % beatInt + beatInt) % beatInt;
  return Math.min(d, beatInt - d) < RHYTHM_WINDOW;
}

function popChain(list) {
  const n = list.length;
  let pts = n * 100 + Math.max(0, n - 3) * (n - 3) * 40;
  const mult = bumpCombo();
  pts = Math.round(pts * mult);
  const c = chainCenter(list);
  // エイサー太鼓リズムボーナス
  if (onEisaBeat()) {
    pts = Math.round(pts * 1.3);
    seDon();
    floats.push({ x: c.x, y: c.y - 64, text: 'ハイサイ♪ リズムボーナス!', life: 1.1, color: '#ffd23e', size: 19 });
  }
  if (fever) pts *= 2;
  score += pts;
  addFever(n);
  skillGauge[list[0].type] = Math.min(SKILL_NEED, skillGauge[list[0].type] + n);
  seChainDone(n);
  praise(n, c);
  floats.push({ x: c.x, y: c.y, text: '+' + pts, life: 1, color: fever ? '#ffd23e' : '#fff', size: 22 + Math.min(14, n * 2) });
  for (const t of list) {
    t.popT = 0.001;
    burst(t.x, t.y, CHARS[t.type].color);
  }
  // 7チェーン以上でシャボン玉ボーナス
  if (n >= 7) {
    const b = newTsum(c.x, Math.min(c.y, FLOOR_Y - R), BUBBLE_TYPE);
    b.vy = -250;
    tsums.push(b);
    floats.push({ x: c.x, y: c.y - 40, text: 'シャボンだま!', life: 1.2, color: '#7fe3ff', size: 20 });
  }
  shakeT = Math.min(0.25, 0.06 + n * 0.015);
  scheduleRespawn(n);
}

function popBubble(b) {
  b.popT = 0.001;
  seBubble();
  burst(b.x, b.y, '#aee9ff');
  let count = 0, habu = 0;
  for (const t of tsums) {
    if (t === b || t.popT > 0 || t.type === BUBBLE_TYPE) continue;
    if (Math.hypot(t.x - b.x, t.y - b.y) < 118) {
      t.popT = 0.001;
      if (t.type === HABU_TYPE) {
        habu++;
        burst(t.x, t.y, '#c9b458');
      } else {
        skillGauge[t.type] = Math.min(SKILL_NEED, skillGauge[t.type] + 1);
        burst(t.x, t.y, CHARS[t.type].color);
        count++;
      }
    }
  }
  const mult = bumpCombo();
  let pts = Math.round(count * 90 * mult) + habu * 500;
  if (fever) pts *= 2;
  score += pts;
  addFever(count + habu);
  if (habu > 0) floats.push({ x: b.x, y: b.y - 56, text: `ハブたいじ! +${habu * 500}`, life: 1.3, color: '#c9f27f', size: 22 });
  if (pts > 0) floats.push({ x: b.x, y: b.y - 30, text: '+' + pts, life: 1, color: '#7fe3ff', size: 24 });
  shakeT = 0.3;
  scheduleRespawn(count + habu);
}

// ---------- キャラスキル ----------
function popByEffect(t, base) {
  t.popT = 0.001;
  if (t.type === HABU_TYPE) {
    burst(t.x, t.y, '#c9b458');
    return 500;
  }
  skillGauge[t.type] = Math.min(SKILL_NEED, skillGauge[t.type] + 1);
  burst(t.x, t.y, CHARS[t.type].color);
  return base;
}

function fireSkill(i) {
  skillGauge[i] = 0;
  skillFlashT = 0.5;
  seSkill();
  bumpCombo();
  floats.push({ x: W / 2, y: H / 2 - 100, text: SKILLS[i].name, life: 1.5, color: CHARS[i].color, size: 32 });
  let pts = 0, removed = 0;
  if (i === 0) {
    // シーサー: 中央の縦列を消す(魔除けなのでハブも退治)
    for (const t of tsums) {
      if (t.popT > 0 || t.type === BUBBLE_TYPE) continue;
      if (Math.abs(t.x - W / 2) < 72) { pts += popByEffect(t, 80); removed++; }
    }
  } else if (i === 1) {
    // ゴーヤ: フィーバーゲージ大幅アップ
    addFever(Math.ceil(FEVER_MAX * 0.4));
  } else if (i === 2) {
    // ジンベエ: 下の段をまとめて食べる
    for (const t of tsums) {
      if (t.popT > 0 || t.type === BUBBLE_TYPE || t.type === HABU_TYPE) continue;
      if (t.y > FLOOR_Y - R * 2.4) { pts += popByEffect(t, 80); removed++; }
    }
  } else if (i === 3) {
    // ハイビスカス: ランダム5個をハイビスカスに変える
    const cand = tsums.filter(t => t.popT === 0 && t.type >= 0 && t.type !== 3);
    for (let k = 0; k < 5 && cand.length > 0; k++) {
      const t = cand.splice((Math.random() * cand.length) | 0, 1)[0];
      t.type = 3;
      burst(t.x, t.y, '#ff9ec4');
    }
  } else if (i === 4) {
    // カメ: 時間+3秒
    timeLeft += 3;
  }
  if (removed > 0) {
    if (fever) pts *= 2;
    score += pts;
    addFever(removed);
    floats.push({ x: W / 2, y: H / 2 - 60, text: '+' + pts, life: 1.2, color: '#fff', size: 26 });
    scheduleRespawn(removed);
    shakeT = 0.25;
  }
}

// スキルアイコンの位置(画面上部)
function skillIconPos(i) {
  return { x: W / 2 + (i - 2) * 88, y: 108, r: 26 };
}

// ---------- 台風イベント ----------
function updateTyphoon(dt) {
  if (typhoon.state === 'none') {
    if (!typhoon.done && playElapsed >= typhoon.at && !fever && timeLeft > 8) {
      typhoon.state = 'warn';
      typhoon.t = 1.5;
      seTyphoonWarn();
      floats.push({ x: W / 2, y: H / 2 - 80, text: 'たいふう ちゅういほう!', life: 1.5, color: '#ff6b5e', size: 30 });
    }
    return;
  }
  typhoon.t -= dt;
  if (typhoon.state === 'warn') {
    if (typhoon.t <= 0) {
      typhoon.state = 'blow';
      typhoon.t = 2.2;
      seWind();
      cancelChain();
      // ハブは風で飛ばされる
      let flew = 0;
      for (const t of tsums) {
        if (t.type === HABU_TYPE && t.popT === 0) { t.popT = 0.001; burst(t.x, t.y, '#c9b458'); flew++; }
      }
      if (flew > 0) floats.push({ x: W / 2, y: 260, text: 'ハブは かぜで とんでいった!', life: 1.4, color: '#e6f4ff', size: 20 });
      shakeT = 0.3;
    }
  } else if (typhoon.state === 'blow') {
    for (const t of tsums) {
      if (t.popT > 0) continue;
      t.vx += Math.sin(globalT * 9 + t.y * 0.02) * 1500 * dt;
      t.vy += (Math.sin(globalT * 7 + t.x * 0.03) * 500 - 430) * dt;
    }
    if (typhoon.t <= 0) {
      typhoon.state = 'none';
      typhoon.done = true;
      floats.push({ x: W / 2, y: H / 2 - 60, text: 'たいふう いっか☀', life: 1.3, color: '#fff', size: 24 });
    }
  }
}

function cancelChain() {
  for (const t of chain) t.sel = false;
  chain = [];
  dragging = false;
}

let respawnQueue = 0, respawnT = 0;
function scheduleRespawn(n) { respawnQueue += n; }

function addFever(n) {
  if (fever) return;
  feverGauge += n;
  if (feverGauge >= FEVER_MAX) {
    fever = true;
    feverT = FEVER_TIME;
    timeLeft += 3;
    seFever();
    floats.push({ x: W / 2, y: H / 2 - 60, text: 'カチャーシー\nフィーバー!!', life: 1.6, color: '#ffd23e', size: 34 });
  }
}

// =========================================================
// パーティクル
// =========================================================
function burst(x, y, color) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 120 + Math.random() * 260;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      life: 0.5 + Math.random() * 0.4,
      maxLife: 0.9,
      color,
      r: 3 + Math.random() * 5,
      star: Math.random() < 0.3,
    });
  }
}

function updateParticles(dt) {
  for (const p of particles) {
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floats) { f.y -= (f.size > 30 ? 12 : 40) * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
}

// =========================================================
// 背景(沖縄の海)
// =========================================================
const clouds = [
  { x: 60, y: 90, s: 1.0, v: 8 },
  { x: 300, y: 150, s: 0.7, v: 12 },
  { x: 420, y: 60, s: 0.85, v: 10 },
];

function drawBG() {
  // 空と海のグラデーション
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  if (fever) {
    const p = 0.5 + 0.5 * Math.sin(globalT * 6);
    sky.addColorStop(0, `rgb(255,${(170 + p * 40) | 0},90)`);
    sky.addColorStop(0.45, '#ff9e7a');
    sky.addColorStop(0.65, '#3ec6c0');
    sky.addColorStop(1, '#128f96');
  } else {
    sky.addColorStop(0, '#8fdcf5');
    sky.addColorStop(0.5, '#bdeef7');
    sky.addColorStop(0.62, '#5fd3cf');
    sky.addColorStop(1, '#1fa9b8');
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 太陽
  ctx.fillStyle = 'rgba(255,250,220,0.9)';
  ctx.beginPath(); ctx.arc(W - 80, 80, 36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,220,0.3)';
  ctx.beginPath(); ctx.arc(W - 80, 80, 52 + Math.sin(globalT * 2) * 4, 0, Math.PI * 2); ctx.fill();

  // 雲
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const c of clouds) {
    c.x += c.v * 0.016;
    if (c.x > W + 80) c.x = -80;
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.beginPath();
    ctx.arc(-24, 0, 16, 0, Math.PI * 2);
    ctx.arc(0, -8, 20, 0, Math.PI * 2);
    ctx.arc(24, 0, 15, 0, Math.PI * 2);
    ctx.rect(-30, 0, 60, 12);
    ctx.fill();
    ctx.restore();
  }

  // 波
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let row = 0; row < 3; row++) {
    const y = H * 0.68 + row * 70;
    ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 8) {
      const yy = y + Math.sin(x * 0.03 + globalT * 1.5 + row * 2) * 6;
      x === -20 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  // 砂浜(床)
  ctx.fillStyle = '#f7e6b8';
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y + 4);
  for (let x = 0; x <= W; x += 12) {
    ctx.lineTo(x, FLOOR_Y + 4 + Math.sin(x * 0.05) * 3);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();
}

// =========================================================
// 描画
// =========================================================
function drawTsum(t) {
  const wob = Math.sin(globalT * 2.4 + t.phase) * 0.02;
  let scale = t.sel ? 1.12 : 1;
  let alpha = 1;
  if (t.popT > 0) {
    const p = t.popT / 0.22;
    scale = 1 + p * 0.5;
    alpha = Math.max(0, 1 - p);
  }
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.globalAlpha = alpha;
  if (t.type === BUBBLE_TYPE) {
    drawBubble(t, scale);
    ctx.restore();
    return;
  }
  ctx.scale(scale * (1 - wob), scale * (1 + wob));
  if (t.sel) {
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 18;
  }
  const spr = t.type === HABU_TYPE ? HABU_SPRITE : SPRITES[t.type];
  ctx.drawImage(spr, -spr.width / 4, -spr.height / 4, spr.width / 2, spr.height / 2);
  ctx.restore();
}

function drawBubble(t, scale) {
  const r = R * scale * (1 + Math.sin(globalT * 4 + t.phase) * 0.04);
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.4, 'rgba(174,233,255,0.35)');
  g.addColorStop(1, 'rgba(127,199,255,0.55)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.65, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke();
  ctx.fillStyle = 'rgba(255,235,140,0.95)';
  drawStar(0, 0, r * 0.35);
}

function drawStar(x, y, r) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const a2 = a + Math.PI / 5;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawChain() {
  if (chain.length === 0) return;
  const col = CHARS[chain[0].type].color;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  chain.forEach((t, i) => i === 0 ? ctx.moveTo(t.x, t.y) : ctx.lineTo(t.x, t.y));
  if (dragging) ctx.lineTo(pointer.x, pointer.y);
  ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = 6;
  ctx.stroke();
  ctx.restore();
  // チェーン数バッジ
  if (chain.length >= 2) {
    const bx = pointer.x, by = Math.max(30, pointer.y - 55);
    ctx.save();
    ctx.fillStyle = chain.length >= 7 ? '#ffd23e' : '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(chain.length, bx, by + 1);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    if (p.star) drawStar(p.x, p.y, p.r * 1.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `bold ${f.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,40,20,0.6)';
    ctx.fillStyle = f.color;
    const lines = f.text.split('\n');
    lines.forEach((ln, i) => {
      ctx.strokeText(ln, f.x, f.y + i * f.size * 1.1);
      ctx.fillText(ln, f.x, f.y + i * f.size * 1.1);
    });
    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  ctx.save();
  // スコア
  ctx.fillStyle = 'rgba(255,255,255,0.75)';

  ctx.strokeStyle = '#215a6b'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(tx, ty, 30, -Math.PI / 2, -Math.PI / 2 + (timeLeft / GAME_TIME) * Math.PI * 2);

  ctx.fillStyle = timeLeft <= 10 ? '#fff' : '#215a6b';

    g.addColorStop(0, '#ffd23e'); g.addColorStop(1, '#ff7e5f');

// キャラスキルのアイコン(上部)
function drawSkillIcons() {
  for (let i = 0; i < 5; i++) {
    const p = skillIconPos(i);
    const ready = skillGauge[i] >= SKILL_NEED;
    const ratio = skillGauge[i] / SKILL_NEED;
    ctx.save();
    ctx.translate(p.x, p.y);
    if (ready) {
      const pu = 1 + Math.sin(globalT * 8) * 0.06;
      ctx.scale(pu, pu);
      ctx.shadowColor = '#ffd23e';
      ctx.shadowBlur = 16;
    }
    // 背景円
    ctx.fillStyle = ready ? 'rgba(255,250,230,0.95)' : 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // キャラの顔(ミニ)
    const spr = SPRITES[i];
    ctx.globalAlpha = ready ? 1 : 0.55;
    ctx.drawImage(spr, -p.r * 0.82, -p.r * 0.82, p.r * 1.64, p.r * 1.64);
    ctx.globalAlpha = 1;
    // ゲージリング
    ctx.strokeStyle = ready ? '#ffb13e' : 'rgba(33,90,107,0.55)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, p.r + 1, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio);
    ctx.stroke();
    if (ready) {
      ctx.fillStyle = '#e8734a';
      ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.strokeText('タップ!', 0, p.r + 14);
      ctx.fillText('タップ!', 0, p.r + 14);
    }
    ctx.restore();
  }
}

// =========================================================
// メインループ
// =========================================================
function startGame() {
  score = 0;
  timeLeft = GAME_TIME;
  feverGauge = 0;
  fever = false;
  feverT = 0;
  chain = [];
  particles = [];
  floats = [];
  respawnQueue = 0;
  combo = 0; comboTimer = 0; comboPopT = 0; maxCombo = 0;
  playElapsed = 0;
  skillGauge = [0, 0, 0, 0, 0];
  skillFlashT = 0;
  typhoon = { state: 'none', t: 0, at: 15 + Math.random() * 20, done: false };
  pendingRank = false;
  newRankIdx = -1;
  fillTsums();
  state = 'play';
  seStart();
  startBGM();
}

function endGame() {
  state = 'result';
  resultDelay = 1.0;
  cancelChain();
  stopBGM();
  seEnd();
  if (score > best) {
    best = score;
    localStorage.setItem('churatsum-best', best);
  }
  // ランキング入り判定 → 名前入力
  pendingRank = score > 0 && (ranking.length < 10 || score > ranking[ranking.length - 1].s);
  if (pendingRank) {
    setTimeout(() => { if (state === 'result' && pendingRank) showNameEntry(); }, 1200);
  }
}

function saveRanking(name) {
  const entry = { n: name, s: score };
  ranking.push(entry);
  ranking.sort((a, b) => b.s - a.s);
  ranking = ranking.slice(0, 10);
  newRankIdx = ranking.indexOf(entry);
  localStorage.setItem('churatsum-rank', JSON.stringify(ranking));
}

function update(dt) {
  globalT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateParticles(dt);

  if (state !== 'play') {
    if (state === 'result') {
      resultDelay -= dt;
      physics(dt);
      for (const t of tsums) if (t.popT > 0) t.popT += dt;
      tsums = tsums.filter(t => t.popT < 0.22);
    }
    if (state === 'title') physics(dt);
    return;
  }

  timeLeft -= dt;
  playElapsed += dt;
  if (timeLeft <= 0) { timeLeft = 0; endGame(); return; }

  if (fever) {
    feverT -= dt;
    if (feverT <= 0) { fever = false; feverGauge = 0; }
  }

  // コンボの制限時間
  if (combo > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }
  if (comboPopT > 0) comboPopT -= dt;
  if (skillFlashT > 0) skillFlashT -= dt;

  updateTyphoon(dt);
  physics(dt);

  // 消えるアニメ → 削除
  for (const t of tsums) if (t.popT > 0) t.popT += dt;
  tsums = tsums.filter(t => t.popT < 0.22);

  // 補充(少しずつパラパラ落とす)。たまにハブが混ざる
  if (respawnQueue > 0) {
    respawnT -= dt;
    if (respawnT <= 0) {
      const habuCount = tsums.filter(t => t.type === HABU_TYPE && t.popT === 0).length;
      if (habuCount < HABU_MAX && playElapsed > 8 && Math.random() < 0.08) {
        tsums.push(newTsum(R + Math.random() * (W - R * 2), CEIL_SPAWN, HABU_TYPE));
      } else {
        spawnTsums(1);
      }
      respawnQueue--;
      respawnT = 0.07;
    }
  }

  if (dragging) tryExtendChain();
}

function render() {
  ctx.save();
  if (shakeT > 0) {
    ctx.translate((Math.random() - 0.5) * 8 * shakeT * 4, (Math.random() - 0.5) * 8 * shakeT * 4);
  }
  if (state === 'title') {
    drawTitle();
  } else if (state === 'ranking') {
    drawRanking();
  } else if (state === 'result') {
    drawResult();
    drawParticles();
  } else {
    drawBG();
    // 上にあるツムから描く(下のツムが手前)
    const sorted = [...tsums].sort((a, b) => a.y - b.y);
    for (const t of sorted) drawTsum(t);
    drawChain();
    drawParticles();
    drawHUD();
    drawTyphoonFx();
    if (fever) {
      const p = 0.5 + 0.5 * Math.sin(globalT * 8);
      ctx.strokeStyle = `rgba(255,210,62,${0.5 + p * 0.5})`;
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10);
    }
  }
  ctx.restore();
}

// 台風の見た目(暗転・風のすじ・注意報の点滅)
function drawTyphoonFx() {
  if (typhoon.state === 'warn') {
    const blink = Math.sin(globalT * 12) > 0;
    if (blink) {
      ctx.fillStyle = 'rgba(255,60,50,0.10)';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255,80,70,0.7)';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, W - 8, H - 8);
    }
  } else if (typhoon.state === 'blow') {
    ctx.fillStyle = 'rgba(30,50,70,0.28)';
    ctx.fillRect(0, 0, W, H);
    // 風のすじ
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const sx = W + 140 - ((globalT * 900 + i * 173) % (W + 280));
      const sy = (i * 47.3) % H;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - 80, sy + 22);
      ctx.stroke();
    }
  }
}

function loop(stamp) {
  const dt = Math.min(0.033, (stamp - lastStamp) / 1000);
  lastStamp = stamp;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// =========================================================
// 入力
// =========================================================
function toGame(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * W,
    y: (e.clientY - rect.top) / rect.height * H,
  };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  pointer = toGame(e);
  if (state === 'title') {
    if (inRect(pointer, RANK_BTN_TITLE)) { state = 'ranking'; return; }
    startGame();
    return;
  }
  if (state === 'ranking') { state = 'title'; return; }
  if (state === 'result') {
    if (resultDelay <= 0) {
      if (inRect(pointer, RANK_BTN_RESULT)) { state = 'ranking'; return; }
      startGame();
    }
    return;
  }
  // スキルアイコン
  for (let i = 0; i < 5; i++) {
    const p = skillIconPos(i);
    if (Math.hypot(pointer.x - p.x, pointer.y - p.y) < p.r + 8) {
      if (skillGauge[i] >= SKILL_NEED) fireSkill(i);
      return;
    }
  }
  if (typhoon.state === 'blow') return;
  const t = tsumAt(pointer.x, pointer.y, 1.1);
  if (!t) return;
  if (t.type === BUBBLE_TYPE) { popBubble(t); return; }
  if (t.type === HABU_TYPE) {
    seHabu();
    floats.push({ x: t.x, y: t.y - 44, text: 'ハブ! つなげない!', life: 1, color: '#ffb0a0', size: 18 });
    t.vy -= 150;
    return;
  }
  dragging = true;
  t.sel = true;
  chain = [t];
  sePop(0);
});

canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  pointer = toGame(e);
});

function endDrag(e) {
  if (e) e.preventDefault();
  if (dragging) {
    dragging = false;
    releaseChain();
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

// ---------- ランキングの名前入力 ----------
const nameOverlay = document.getElementById('nameOverlay');
const nameInput = document.getElementById('nameInput');
document.getElementById('nameOk').addEventListener('click', confirmName);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmName(); });

function showNameEntry() {
  nameOverlay.style.display = 'flex';
  nameInput.value = localStorage.getItem('churatsum-name') || '';
  setTimeout(() => nameInput.focus(), 60);
}

function confirmName() {
  const name = (nameInput.value.trim() || 'なーなしぐゎー').slice(0, 8);
  localStorage.setItem('churatsum-name', name);
  nameOverlay.style.display = 'none';
  pendingRank = false;
  saveRanking(name);
  state = 'ranking';
}

// タイトル画面の背景にもツムを敷いておく
fillTsums();
requestAnimationFrame(loop);
</script>
</body>
</html>
